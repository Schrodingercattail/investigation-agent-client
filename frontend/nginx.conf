# Production reverse proxy: static assets + same-origin /api routing.
# `backend` resolves through Docker Compose service-name DNS.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Built Vite assets are content-hashed — cache aggressively.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API: same origin for the browser, resolved server-side to the
    # backend container (mirrors the Vite dev proxy /api → backend:8001).
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;   # investigation turns include LLM planning
    }

    # Health passthrough for container orchestration.
    location = /health {
        proxy_pass http://backend:8001/health;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
